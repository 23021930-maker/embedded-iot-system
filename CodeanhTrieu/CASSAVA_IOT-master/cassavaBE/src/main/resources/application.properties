spring.mvc.async.request-timeout=600000
server.port=8081
spring.data.mongodb.uri=mongodb://admin:uet%402026@112.137.129.218:27017/iot_agriculture?authSource=admin
spring.data.mongodb.auto-index-creation=false

# Operation MQTT broker (commands → edge / acks ← edge)
mqtt.operation.broker-url=tcp://112.137.129.218:1883
mqtt.operation.client-id=cassava-be-dev
mqtt.operation.username=
mqtt.operation.password=
mqtt.operation.ack-timeout-seconds=60

# Sensor MQTT (shares operation broker; topics for weather + per-field soil moisture)
# Weather is published hourly (matches ml-service training cadence). Soil stays minutely.
mqtt.sensor.weather-topic=/sensor/weatherStation2
mqtt.sensor.soil-topics=field1,field2,field3,field4,field2.1,field4.1
mqtt.sensor.weather-group-id=default

# Anomaly detection is two-tier:
#   Tier 1 — RangeCheckService physical-bounds gate (in-process, anomaly.range.* below).
#            Out-of-range readings are flagged as `range_check` corrections and the
#            ml-service call is skipped.
#   Tier 2 — in-range readings go to the ml-service /detect endpoint (zscore +
#            seasonal_zscore + arima_residual + sarima_residual per weather sensor).
#            The BE picks one method's verdict per sensor and persists the imputation
#            to `sensor_correction` when that method flags anomaly.
# Defaults (in PreferredDetectionMethods) come from the benchmark winners:
#   temperature / relativeHumidity / radiation / wind  → seasonal_zscore
#   rain                                                → sarima_residual
# Override per sensor here if you re-benchmark and want a different choice:
#   ml.detection.preferred-method.<sensorId>=<methodName>
ml.service.url=http://localhost:8082
ml.service.timeout-ms=2000

# Tier-1 physical-range bounds (RangeCheckService). A reading outside [min,max]
# is rejected before the ml-service call. Units: °C, %, mm/h, MJ/m²/h, m/s.
anomaly.range.temperature.min=-10
anomaly.range.temperature.max=60
anomaly.range.relativeHumidity.min=0
anomaly.range.relativeHumidity.max=100
anomaly.range.rain.min=0
anomaly.range.rain.max=500
anomaly.range.radiation.min=0
anomaly.range.radiation.max=1500
anomaly.range.wind.min=0
anomaly.range.wind.max=50
anomaly.range.humidity30.min=0
anomaly.range.humidity30.max=100
anomaly.range.humidity60.min=0
anomaly.range.humidity60.max=100
