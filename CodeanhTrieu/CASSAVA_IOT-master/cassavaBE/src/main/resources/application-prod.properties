# Production profile — activate với: --spring.profiles.active=prod
# Hoặc env SPRING_PROFILES_ACTIVE=prod

# Bind loopback only; public traffic đi qua nginx reverse proxy
server.address=127.0.0.1
server.port=8081

# Async + MongoDB giữ như base
spring.mvc.async.request-timeout=600000
spring.data.mongodb.uri=mongodb://admin:uet%402026@112.137.129.218:27017/iot_agriculture?authSource=admin
spring.data.mongodb.auto-index-creation=false

# Logging production — ghi ra file, ít verbose hơn
logging.file.name=/var/log/cassava/app.log
logging.level.root=INFO
logging.level.com.example.demo=INFO

# Operation MQTT broker (commands → edge / acks ← edge)
# Server runs mosquitto on loopback; pi3 connects via outbound to public IP
mqtt.operation.broker-url=tcp://127.0.0.1:1883
mqtt.operation.client-id=cassava-be-prod
mqtt.operation.username=libe
mqtt.operation.password=123456
mqtt.operation.ack-timeout-seconds=60

# Sensor MQTT (shares operation broker; topics for weather + per-field soil moisture)
# Weather is published hourly (matches ml-service training cadence). Soil stays minutely.
mqtt.sensor.weather-topic=/sensor/weatherStation2
mqtt.sensor.soil-topics=field1,field2,field3,field4,field2.1,field4.1
mqtt.sensor.weather-group-id=default

# Anomaly detection is two-tier: Tier-1 RangeCheckService physical-bounds gate
# (anomaly.range.* below) → out-of-range readings flagged as `range_check` and the
# ml-service call skipped; Tier-2 in-range readings go to ml-service /detect
# (loopback). Preferred-method-per-sensor defaults live in PreferredDetectionMethods;
# override via `ml.detection.preferred-method.<sensorId>=<methodName>` if needed.
ml.service.url=http://127.0.0.1:8082
ml.service.timeout-ms=2000

# Tier-1 physical-range bounds (RangeCheckService). Units: °C, %, mm/h, MJ/m²/h, m/s.
anomaly.range.temperature.min=-10
anomaly.range.temperature.max=60
anomaly.range.relativeHumidity.min=0
anomaly.range.relativeHumidity.max=100
anomaly.range.rain.min=0
anomaly.range.rain.max=500
anomaly.range.radiation.min=0
anomaly.range.radiation.max=1500
anomaly.range.wind.min=0
anomaly.range.wind.max=50
anomaly.range.humidity30.min=0
anomaly.range.humidity30.max=100
anomaly.range.humidity60.min=0
anomaly.range.humidity60.max=100
